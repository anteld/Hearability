<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Time Logger</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .name-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .number-button {
            padding: 25px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            cursor: pointer;
            transition: 0.15s;
        }

        .number-button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .number-button:active {
            transform: scale(0.97);
        }

        .numberb-button {
            padding: 25px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: #dc3545;
            color: white;
            cursor: pointer;
            transition: 0.15s;
        }

        .numberb-button:hover {
            background: #a11e2b;
            transform: translateY(-2px);
        }

        .numberb-button:active {
            transform: scale(0.97);
        }

        h2 {
            margin-bottom: 10px;
        }

        .log-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f0f2f5;
        }

        .clear-button,
        .undo-button,
        .send-button {
            margin-top: 15px;
            margin-left: 0px;
            margin-right: 10px;
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .clear-button {
            background: #dc3545;
            color: white;
        }

        .clear-button:hover {
            background: #b02a37;
        }

        .undo-button {
            background: #ffc107;
            color: #222;
        }

        .send-button {
            background: #00C742;
            color: white;
        }

        .undo-button:hover {
            background: #e0a800;
        }

        .send-button:hover {
            background: #0d4d1b;
        }

        .message {
            color: #dc3545;
            margin-top: 8px;
            min-height: 20px;
        }

        .onoffswitch {
            position: relative; width: 200px;
            -webkit-user-select:none; -moz-user-select:none; -ms-user-select: none;
        }
        .onoffswitch-checkbox {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .onoffswitch-label {
            display: block; overflow: hidden; cursor: pointer;
            border: 2px solid #999999; border-radius: 20px;
        }
        .onoffswitch-inner {
            display: block; width: 200%; margin-left: -100%;
            transition: margin 0.3s ease-in 0s;
        }
        .onoffswitch-inner:before, .onoffswitch-inner:after {
            display: block; float: left; width: 50%; height: 30px; padding: 0; line-height: 30px;
            font-size: 14px; color: white; font-family: Trebuchet, Arial, sans-serif; font-weight: bold;
            box-sizing: border-box;
        }
        .onoffswitch-inner:before {
            content: "Listening";
            padding-left: 10px;
            background-color: #00C742; color: #FFFFFF;
        }
        .onoffswitch-inner:after {
            content: "Not Listening";
            padding-right: 10px;
            background-color: #dc3545; color: #FFFFFF;
            text-align: right;
        }
        .onoffswitch-switch {
            display: block; width: 15px; margin: 7.5px;
            background: #FFFFFF;
            position: absolute; top: 0; bottom: 0;
            right: 166px;
            border: 2px solid #999999; border-radius: 20px;
            transition: all 0.3s ease-in 0s; 
        }
        .onoffswitch-checkbox:checked + .onoffswitch-label .onoffswitch-inner {
            margin-left: 0;
        }
        .onoffswitch-checkbox:checked + .onoffswitch-label .onoffswitch-switch {
            right: 0px; 
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hearability log</h1>

    <div class="name-section">
        <label for="name">Your name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <div id="message" class="message"></div>
    </div>

    <div class="onoffswitch">
        <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox" id="myonoffswitch" tabindex="0" onchange="toggleListening()">
        <label class="onoffswitch-label" for="myonoffswitch">
            <span class="onoffswitch-inner"></span>
            <span class="onoffswitch-switch"></span>
        </label>
    </div>

    <h6></h6>
    <h6></h6>

    <div class="buttons">
        <button class="number-button" onclick="logButton(0)">0</button>
        <button class="number-button" onclick="logButton(1)">1</button>
        <button class="number-button" onclick="logButton(2)">2</button>
        <button class="numberb-button" onclick="logButton(3)">0</button>
        <button class="numberb-button" onclick="logButton(4)">1</button>
        <button class="numberb-button" onclick="logButton(5)">2</button>
    </div>

    <button class="clear-button" onclick="clearLog()">
        Clear all logs
    </button>

    <button class="undo-button" onclick="removeLastLog()">
        Remove Last Entry
    </button>

    <button class="send-button" onclick="sendData()">
        Send Data
    </button>


    <h2>Log</h2>

    <div class="log-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Button</th>
                    <th>Date</th>
                    <th>Time</th>
                </tr>
            </thead>

            <tbody id="log">
            </tbody>
        </table>
    </div>

</div>

<script>

    // Load existing logs from browser storage
    let logs = JSON.parse(localStorage.getItem("buttonLogs")) || [];

    // Display logs when the page loads
    displayLogs();

    function toggleListening() {
        const nameInput = document.getElementById("name");
        const message = document.getElementById("message");
        const switchInput = document.getElementById("myonoffswitch");

        const name = nameInput.value.trim();

        // Make sure a name has been entered
        if (name === "") {
            message.textContent = "Please enter your name first.";
            nameInput.focus();

            // Undo the visual switch change
            switchInput.checked = false;

            return;
        }

        message.textContent = "";

        // Use the checkbox itself as the source of truth
        const listening = switchInput.checked;

        const now = new Date();

        const logEntry = {
            name: name,
            button: "listening: " + listening,
            date: now.toLocaleDateString(),
            time: now.toLocaleTimeString(),
            timestamp: now.toISOString()
        };

        logs.push(logEntry);

        localStorage.setItem("buttonLogs", JSON.stringify(logs));

        displayLogs();
    }

    function logButton(buttonNumber) {

        const nameInput = document.getElementById("name");
        const message = document.getElementById("message");

        const name = nameInput.value.trim();

        // Make sure a name has been entered
        if (name === "") {
            message.textContent = "Please enter your name first.";
            nameInput.focus();
            return;
        }

        message.textContent = "";

        // Get the current date and time
        const now = new Date();

        const logEntry = {
            name: name,
            button: buttonNumber,
            date: now.toLocaleDateString(),
            time: now.toLocaleTimeString(),
            timestamp: now.toISOString()
        };

        // Add the new entry
        logs.push(logEntry);

        // Save the log
        localStorage.setItem("buttonLogs", JSON.stringify(logs));

        // Update the table
        displayLogs();
    }


    function displayLogs() {

        const logTable = document.getElementById("log");

        logTable.innerHTML = "";

        // Show newest entries first
        [...logs].reverse().forEach(entry => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${escapeHTML(entry.name)}</td>
                <td><strong>${entry.button}</strong></td>
                <td>${entry.date}</td>
                <td>${entry.time}</td>
            `;

            logTable.appendChild(row);
        });
    }

    async function sendData() {

        if (logs.length === 0) {
            alert("There are no logs to send.");
            return;
        }

        const dataToSend = JSON.stringify({
            data: logs
        });


        const SUPABASE_URL = "https://agotmpzjwiggaofihxxe.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Pl6IHbsW7HuOP1Ta-FdNnA_D2M3VfTr";

        const response = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Prefer": "return=minimal"
            },
            body: JSON.stringify({
                data: logs
            })
        });

        if (!response.ok) {
            const error = await response.text();
            throw new Error(`Supabase error: ${error}`);
        }
    }


    // Remove the most recently entered log
    function removeLastLog() {

        if (logs.length === 0) {
            alert("There are no logs to remove.");
            return;
        }

        logs.pop();

        localStorage.setItem("buttonLogs", JSON.stringify(logs));

        displayLogs();
    }


    // Remove all logs
    function clearLog() {

        if (logs.length === 0) {
            return;
        }

        if (confirm("Are you sure you want to delete the entire log?")) {

            logs = [];

            localStorage.removeItem("buttonLogs");

            displayLogs();
        }
    }


    // Prevent names containing HTML from being interpreted as HTML
    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }

    let wakeLock = null;
 
    // Funktion för att aktivera "Keep Awake"
    async function requestWakeLock() {
    try {
        // Begär skärmlås från webbläsaren
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('Skärmen hålls nu vaken!');
    } catch (err) {
        // Misslyckas oftast om batteriet är kritiskt lågt
        console.error(`${err.name}, ${err.message}`);
    }
    }

</script>

</body>
</html>
